  appendices:
    - glossary.qmd
    - sources.qmd
  downloads: [epub]
format:
  html:
    theme: default
    css: styles.css
    toc: true
    toc-location: body
    toc-title: "In this lesson"
    toc-depth: 2
    anchor-sections: false
    code-copy: true
    code-overflow: scroll
    number-sections: false
    number-depth: 0
    highlight-style: github
    include-before-body: includes/shell.html
    include-after-body: includes/scripts.html
  epub:
    toc: true
    css: epub.css
execute:
  freeze: auto
