project:
  type: book
  output-dir: _book
  pre-render: python3 ../../scripts/sync_curriculum.py
  resources:
    - curriculum.json
    - assets/**
lang: ar
dir: rtl
book:
  title: "Java Learning Library"
  author: "Java Learning Library"
  site-url: https://mohammadwajdi19980-creator.github.io/java-learning-library/
  repo-url: https://github.com/mohammadwajdi19980-creator/java-learning-library
  repo-subdir: books/java
  repo-branch: main
  repo-actions: [source]
  search: true
  sidebar:
    title: "Java Library"
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "M01 · Java & Tools"
      chapters:
        - modules/m01.qmd
        - lessons/lesson-000.qmd
        - lessons/lesson-001.qmd
        - subjects/s01.qmd
        - subjects/s02.qmd
    - roadmap.qmd
    - projects.qmd
    - exams.qmd
    - part: "Planned Curriculum"
      chapters:
        - modules/m02.qmd
        - modules/m03.qmd
        - modules/m04.qmd
        - modules/m05.qmd
        - modules/m06.qmd
        - modules/m07.qmd
