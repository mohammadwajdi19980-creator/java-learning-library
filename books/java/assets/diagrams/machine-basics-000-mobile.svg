<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 490" role="img" aria-label="Binary represents both data and CPU-specific instructions"><rect width="420" height="490" rx="16" fill="#f6f8f7"/><g fill="#172e38" font-family="DejaVu Sans,Arial,sans-serif"><text x="24" y="45" font-size="27">Binary: 0 and 1</text><rect x="20" y="72" width="380" height="171" rx="12" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="38" y="111" font-size="25">Data</text><text x="38" y="151" font-size="24">00000101 represents 5</text><text x="38" y="192" font-size="20">Unsigned 8-bit data example</text><text x="38" y="221" font-size="20">Not a command to print 5</text><rect x="20" y="265" width="380" height="197" rx="12" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="38" y="307" font-size="25">Machine Language</text><text x="38" y="347" font-size="21">Encoded instructions for</text><text x="38" y="376" font-size="21">a specific Processor</text><text x="38" y="415" font-size="20">Not every bit pattern</text><text x="38" y="443" font-size="20">is a valid instruction</text></g></svg>