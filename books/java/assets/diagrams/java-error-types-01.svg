<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" role="img" aria-labelledby="t d"><title id="t">Three types of errors in Java</title><desc id="d">Comparison cards: compile-time stops at compilation, runtime stops during execution and logical errors complete but give a wrong result.</desc><rect width="1100" height="370" rx="24" fill="#f5f9f8"/><text x="550" y="53" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="27" fill="#254650">Three Ways a Program Can Go Wrong</text><rect x="29" y="101" width="327" height="235" rx="19" fill="#fff" stroke="#d4e3df"/><rect x="45" y="119" width="295" height="48" rx="10" fill="#f8e9e7"/><text x="193" y="150" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#8e4c4a">COMPILE-TIME</text><text x="193" y="219" text-anchor="middle" font-family="monospace" font-size="22" fill="#203e4a">Out ≠ out</text><text x="193" y="270" text-anchor="middle" font-family="Arial" font-size="16" fill="#56717a">Compiler blocks the build</text><text x="193" y="310" text-anchor="middle" font-family="Arial" font-size="13" fill="#7a9191">Compilation</text></rect><rect x="388" y="101" width="327" height="235" rx="19" fill="#fff" stroke="#d4e3df"/><rect x="404" y="119" width="295" height="48" rx="10" fill="#faf0df"/><text x="552" y="150" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#925c29">RUNTIME</text><text x="552" y="219" text-anchor="middle" font-family="monospace" font-size="22" fill="#203e4a">10 / 0</text><text x="552" y="270" text-anchor="middle" font-family="Arial" font-size="16" fill="#56717a">Fails during execution</text><text x="552" y="310" text-anchor="middle" font-family="Arial" font-size="13" fill="#7a9191">Execution</text></rect><rect x="747" y="101" width="327" height="235" rx="19" fill="#fff" stroke="#d4e3df"/><rect x="763" y="119" width="295" height="48" rx="10" fill="#e5f4ed"/><text x="911" y="150" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#266f66">LOGICAL</text><text x="911" y="219" text-anchor="middle" font-family="monospace" font-size="22" fill="#203e4a">(5+1)/2 ≠ 5+1/2</text><text x="911" y="270" text-anchor="middle" font-family="Arial" font-size="16" fill="#56717a">Runs with the wrong answer</text><text x="911" y="310" text-anchor="middle" font-family="Arial" font-size="13" fill="#7a9191">Expected result</text></rect></svg>