<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 551" role="img" aria-labelledby="title"><title id="title">Where Java Is Used</title><rect width="420" height="551" rx="12" fill="#f5f6f9"/><text x="22" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#26334a">Where Java Is Used</text><rect x="18" y="70" width="384" height="88" rx="8" fill="white" stroke="#d9dfea"/><text x="35" y="101" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334a9f">Desktop</text><text x="35" y="131" font-family="Arial,sans-serif" font-size="16" fill="#3d495d">Applications on compatible PCs</text><path d="M210 164v13m-5-5 5 5 5-5" fill="none" stroke="#68789e" stroke-width="2"/><rect x="18" y="184" width="384" height="88" rx="8" fill="white" stroke="#d9dfea"/><text x="35" y="215" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334a9f">Web Backend</text><text x="35" y="245" font-family="Arial,sans-serif" font-size="16" fill="#3d495d">Server logic and APIs</text><path d="M210 278v13m-5-5 5 5 5-5" fill="none" stroke="#68789e" stroke-width="2"/><rect x="18" y="298" width="384" height="88" rx="8" fill="white" stroke="#d9dfea"/><text x="35" y="329" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334a9f">Enterprise</text><text x="35" y="359" font-family="Arial,sans-serif" font-size="16" fill="#3d495d">Connected business systems</text><path d="M210 392v13m-5-5 5 5 5-5" fill="none" stroke="#68789e" stroke-width="2"/><rect x="18" y="412" width="384" height="88" rx="8" fill="white" stroke="#d9dfea"/><text x="35" y="443" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334a9f">Android</text><text x="35" y="473" font-family="Arial,sans-serif" font-size="14" fill="#3d495d">Java is supported; Kotlin is preferred</text></svg>