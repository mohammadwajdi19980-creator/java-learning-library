<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="t d"><title id="t">Anatomy of the first Java program</title><desc id="d">The Java code package intro, public class FirstProgram, public static void main, and System.out.println with brackets and semicolon is annotated with four teaching callouts.</desc><rect width="1100" height="580" rx="24" fill="#eff7f6"/><rect x="28" y="26" width="1044" height="526" rx="17" fill="#fff" stroke="#d1e1df"/><rect x="28" y="26" width="1044" height="53" rx="17" fill="#253f4d"/><text x="55" y="60" font-family="monospace" font-size="20" fill="#fff">FirstProgram.java</text><g font-family="monospace" font-size="23" fill="#254a57"><text x="66" y="145" fill="#35719b">package intro;</text><text x="66" y="201"><tspan fill="#407ab0">public class </tspan>FirstProgram {</text><text x="115" y="258"><tspan fill="#407ab0">public static void </tspan>main(String[] args) {</text><text x="166" y="322">System.out.println(<tspan fill="#b4794a">"Hello, Java!"</tspan>);</text><text x="115" y="372">}</text><text x="66" y="418">}</text></g><g font-family="Arial" font-size="16" font-weight="bold" fill="#215e63"><rect x="683" y="98" width="332" height="43" rx="11" fill="#e4f5ef" stroke="#b6ddd0"/><text x="698" y="126">1 · Package: organize classes</text><rect x="683" y="168" width="332" height="43" rx="11" fill="#e4f5ef" stroke="#b6ddd0"/><text x="698" y="196">2 · Class: program container</text><rect x="683" y="242" width="332" height="43" rx="11" fill="#e4f5ef" stroke="#b6ddd0"/><text x="698" y="270">3 · main(): execution begins</text><rect x="683" y="317" width="332" height="43" rx="11" fill="#e4f5ef" stroke="#b6ddd0"/><text x="698" y="345">4 · println(): prints a line</text></g><path d="M240 139 H659 V119 H679 M426 196 H679 M620 252 H679 M580 321 H679" stroke="#7aada8" fill="none" stroke-width="2"/><rect x="51" y="454" width="975" height="65" rx="12" fill="#f3f8f6"/><text x="64" y="477" font-family="Arial" font-size="15" fill="#526b70">Braces { } define code blocks. Parentheses ( ) hold arguments.</text><text x="64" y="500" font-family="Arial" font-size="15" fill="#526b70">Double quotes " " delimit text; semicolon ; ends a Java statement.</text></svg>