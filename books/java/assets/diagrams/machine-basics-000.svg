<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-label="Binary represents both data and CPU-specific instructions"><rect width="720" height="345" rx="16" fill="#f6f8f7"/><g fill="#172e38" font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="46" font-size="29">Binary: 0 and 1</text><rect x="25" y="78" width="320" height="232" rx="12" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><rect x="375" y="78" width="320" height="232" rx="12" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="45" y="122" font-size="27">Data</text><text x="45" y="171" font-size="27">00000101</text><text x="45" y="211" font-size="21">represents the number 5</text><text x="45" y="268" font-size="20">Unsigned 8-bit example</text><text x="395" y="122" font-size="25">Machine Language</text><text x="395" y="171" font-size="22">Encoded instructions</text><text x="395" y="211" font-size="21">for a specific Processor</text><text x="395" y="268" font-size="20">Not every bit pattern</text><text x="395" y="294" font-size="20">is a valid instruction</text></g></svg>