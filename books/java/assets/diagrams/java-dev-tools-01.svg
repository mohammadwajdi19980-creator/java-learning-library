<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc"><title id="title">The Java development toolchain</title><desc id="desc">JDK provides javac compiler and Java runtime. NetBeans IDE provides editor, files, run and error help, communicating with installed JDK.</desc><rect width="1100" height="370" rx="26" fill="#f6faf8"/><text x="550" y="48" font-family="Arial" font-size="28" font-weight="bold" fill="#213d45" text-anchor="middle">Two Tools, One Working Java Program</text><rect x="38" y="94" width="460" height="213" rx="19" fill="#fff" stroke="#b7d3cb" stroke-width="2"/><rect x="602" y="94" width="460" height="213" rx="19" fill="#fff" stroke="#b7d3cb" stroke-width="2"/><rect x="55" y="111" width="426" height="52" rx="11" fill="#e5f1ee"/><rect x="619" y="111" width="426" height="52" rx="11" fill="#eaf1fa"/><text x="268" y="144" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#126d65">JDK</text><text x="832" y="144" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#225f83">Apache NetBeans IDE</text><text x="268" y="203" font-family="Arial" font-size="18" text-anchor="middle" fill="#264750">javac  ·  java  ·  tools</text><text x="832" y="203" font-family="Arial" font-size="18" text-anchor="middle" fill="#264750">Editor  ·  Projects  ·  Run  ·  Output</text><text x="268" y="250" font-family="Arial" font-size="17" text-anchor="middle" fill="#546d71">Compiles and runs Java programs</text><text x="832" y="250" font-family="Arial" font-size="17" text-anchor="middle" fill="#546d71">Helps you write and manage code</text><path d="M508 200 H590" stroke="#238480" stroke-width="5" stroke-linecap="round"/><path d="M510 200 l16 -10 v20z M588 200 l-16 -10 v20z" fill="#238480"/><text x="550" y="185" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#167a74">WORK TOGETHER</text><text x="550" y="346" font-family="Arial" font-size="15" text-anchor="middle" fill="#62777c">A Java project can exist without an IDE, but it still needs compatible build and runtime tools.</text></svg>