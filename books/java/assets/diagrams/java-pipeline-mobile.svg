 x="35" y="557" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334a9f">Processor</text><text x="35" y="587" font-family="Arial,sans-serif" font-size="16" fill="#3d495d">Executes native Machine Code</text><text x="35" y="647" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#26334a">Output: Java</text></svg>