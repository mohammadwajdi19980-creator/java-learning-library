<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" role="img" aria-labelledby="t d"><title id="t">Java Execution Pipeline</title><desc id="d">Java source code compiles to bytecode with javac. The JVM runs bytecode through interpretation and possibly JIT compilation. The physical Processor executes native Machine Code. The Output of this example is Java.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F0FAF8"/><stop offset="1" stop-color="#E8F2F6"/></linearGradient><linearGradient id="dk" x2="0" y2="1"><stop stop-color="#113C50"/><stop offset="1" stop-color="#0D6370"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183F4A" flood-opacity=".12"/></filter></defs><rect width="1240" height="480" rx="25" fill="url(#bg)"/><text x="620" y="58" text-anchor="middle" font-family="Arial" font-weight="700" font-size="32" fill="#12394B">How This Java Example Runs</text><text x="620" y="88" text-anchor="middle" font-family="Arial" font-size="16" fill="#60747E">Bytecode targets the JVM · Machine Code targets the Processor</text>
