<text x="124" y="175" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#11394B">SOURCE CODE</text><text x="124" y="225" text-anchor="middle" font-family="monospace" font-size="22" fill="#137783">Main.java</text><text x="124" y="272" text-anchor="middle" font-family="monospace" font-size="13" fill="#4A6876">println("Java")</text><text x="124" y="314" text-anchor="middle" font-family="Arial" font-size="14" fill="#58727A">Your instructions</text>
<text x="372" y="175" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#11394B">COMPILER</text><text x="372" y="242" text-anchor="middle" font-family="monospace" font-size="32" fill="#0B8790">javac</text><text x="372" y="313" text-anchor="middle" font-family="Arial" font-size="14" fill="#58727A">Checks + translates</text>
<text x="620" y="175" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#11394B">BYTECODE</text><text x="620" y="225" text-anchor="middle" font-family="monospace" font-size="22" fill="#137783">Main.class</text><text x="620" y="268" text-anchor="middle" font-family="monospace" font-size="14" fill="#4A6876">JVM instructions</text><text x="620" y="313" text-anchor="middle" font-family="Arial" font-size="14" fill="#58727A">Platform neutral</text>
