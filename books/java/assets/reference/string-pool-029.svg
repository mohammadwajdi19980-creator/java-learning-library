<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="Two literal references share a String and new String is distinct"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#225e66"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8f7"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#172e38" font-size="25"><text x="25" y="42" font-size="24">String a = &quot;Hello&quot;, b = &quot;Hello&quot;;</text><text x="25" y="80" font-size="24">String c = new String(&quot;Hello&quot;);</text><rect x="30" y="118" width="100" height="52" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="46" y="153.0" font-size="25">a</text><rect x="30" y="194" width="100" height="52" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="46" y="229.0" font-size="25">b</text><rect x="30" y="307" width="100" height="52" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="46" y="342.0" font-size="25">c</text><path d="M135,144 L367,182" stroke="#225e66" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M135,220 L367,190" stroke="#225e66" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M135,333 L367,333" stroke="#225e66" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="383" y="131" font-size="24">String Pool</text><rect x="385" y="154" width="255" height="60" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="401" y="193.0" font-size="25">&quot;Hello&quot;</text><rect x="385" y="301" width="255" height="60" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="401" y="340.0" font-size="25">&quot;Hello&quot;</text><text x="385" y="272" font-size="24">Distinct Object</text></g></svg>