<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Array assignment copies a reference"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#225e66"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8f7"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#172e38" font-size="25"><text x="28" y="44" font-size="25">a = b;  // one shared Array</text><rect x="35" y="80" width="110" height="55" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="51" y="116.5" font-size="25">a</text><rect x="35" y="160" width="110" height="55" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="51" y="196.5" font-size="25">b</text><path d="M150,107 L333,148" stroke="#225e66" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M150,187 L333,158" stroke="#225e66" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="350" y="120" width="100" height="70" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="370" y="164">40</text><text x="386" y="228" font-size="23">0</text><rect x="455" y="120" width="100" height="70" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="475" y="164">50</text><text x="491" y="228" font-size="23">1</text><rect x="560" y="120" width="100" height="70" rx="10" fill="#e4f0ed" stroke="#225e66" stroke-width="2"/><text x="580" y="164">60</text><text x="596" y="228" font-size="23">2</text><text x="28" y="298" font-size="25">b[0] = 100;</text><text x="28" y="349" font-size="24">a[0] is now 100 — same Element</text></g></svg>